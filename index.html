<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Sedang Maintenance</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        color 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        :root[data-theme="light"] {
            --bg-base: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --panel-border: rgba(226, 232, 240, 0.8);
            --panel-border-glow: rgba(217, 119, 6, 0.25);
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --accent-glow: rgba(217, 119, 6, 0.12);
            --btn-main: #0f172a;
            --btn-text: #ffffff;
            --btn-hover: #d97706;
            --shadow-custom: 0 20px 40px -15px rgba(15, 23, 42, 0.05), 0 0 0 1px rgba(226, 232, 240, 0.8) inset;
            --silhouette: #0f172a;
            --theme-accent: #d97706;
            --badge-bg: #fef3c7;
            --badge-text: #b45309;
        }

        :root[data-theme="dark"] {
            --bg-base: #030712;
            --panel-bg: rgba(17, 24, 39, 0.75);
            --panel-border: rgba(31, 41, 55, 0.8);
            --panel-border-glow: rgba(245, 158, 11, 0.3);
            --text-primary: #f9fafb;
            --text-muted: #9ca3af;
            --accent-glow: rgba(245, 158, 11, 0.15);
            --btn-main: #f9fafb;
            --btn-text: #030712;
            --btn-hover: #f59e0b;
            --shadow-custom: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(31, 41, 55, 0.8) inset;
            --silhouette: #f9fafb;
            --theme-accent: #f59e0b;
            --badge-bg: rgba(120, 53, 15, 0.3);
            --badge-text: #fcd34d;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: clamp(1rem, 3vw, 2rem);
        }

        .mesh-background {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(var(--text-muted) 1px, transparent 1px);
            background-size: 32px 32px;
            opacity: 0.05;
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            width: min(650px, 90vw);
            height: min(650px, 90vw);
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: moveGlow 14s ease-in-out infinite alternate;
        }

        @keyframes moveGlow {
            0% { transform: translate(-10vw, -10vh) scale(0.9); }
            100% { transform: translate(10vw, 10vh) scale(1.15); }
        }

        /* Transisi Layar */
        .page-transition {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 1rem;
        }
        
        .page-transition.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modern-spinner {
            width: clamp(38px, 10vw, 48px);
            height: clamp(38px, 10vw, 48px);
            border: 3px solid rgba(245, 158, 11, 0.15);
            border-top: 3px solid var(--theme-accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .transition-text {
            color: #f9fafb;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 600;
            text-align: center;
        }

        /* Kontrol Header Responsif */
        .controls-container {
            position: fixed;
            top: clamp(1rem, 3vw, 1.8rem);
            left: clamp(1rem, 3vw, 1.8rem);
            right: clamp(1rem, 3vw, 1.8rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .audio-controls {
            display: flex;
            gap: clamp(8px, 2vw, 12px);
            pointer-events: auto;
        }

        .control-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: clamp(40px, 11vw, 48px);
            height: clamp(40px, 11vw, 48px);
            border-radius: clamp(12px, 3vw, 16px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            box-shadow: var(--shadow-custom);
        }
        .control-btn:hover {
            transform: scale(1.08) translateY(-2px);
            border-color: var(--panel-border-glow);
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        .control-btn.disabled {
            opacity: 0.35;
            filter: grayscale(90%);
        }

        .right-controls {
            pointer-events: auto;
        }

        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ==========================================================
           HUD CONTAINER UTAMA (RESPONSIF PENUH DI SEMUA DEVICE)
           ========================================================== */
        .hud-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
            z-index: 10;
            margin: auto 0;
            padding-bottom: clamp(110px, 22vh, 140px); /* Ruang aman untuk animasi teknisi */
        }

        .hud-container {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: clamp(24px, 5vw, 36px);
            padding: clamp(1.8rem, 5vw, 2.8rem);
            box-shadow: var(--shadow-custom);
            text-align: left;
            animation: containerFloat 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes containerFloat {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .hud-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: clamp(0.8rem, 2vw, 1.2rem);
        }

        .hud-dot {
            width: 8px;
            height: 8px;
            background-color: var(--theme-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--theme-accent);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(2.2); opacity: 0.2; }
        }

        .hud-title-tag {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(0.7rem, 2vw, 0.8rem);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--badge-text);
            background: var(--badge-bg);
            padding: clamp(4px, 1vw, 6px) clamp(10px, 2.5vw, 14px);
            border-radius: 100px;
            font-weight: 700;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 700;
            line-height: 1.15;
            color: var(--text-primary);
            margin-bottom: clamp(0.6rem, 2vw, 0.9rem);
            letter-spacing: -0.02em;
        }

        .hud-desc {
            font-size: clamp(0.88rem, 2.4vw, 0.98rem);
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: clamp(1.8rem, 4vw, 2.4rem);
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Tombol Reload Responsif */
        .reload-btn {
            position: relative;
            width: 100%;
            background: var(--btn-main);
            color: var(--btn-text);
            border: 1px solid transparent;
            padding: clamp(14px, 3.5vw, 16px) clamp(18px, 4vw, 22px);
            border-radius: clamp(14px, 3.5vw, 18px);
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(0.92rem, 2.5vw, 1rem);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .reload-btn:disabled {
            cursor: wait; 
            opacity: 0.85;
        }

        .reload-btn:not(:disabled) {
            cursor: pointer;
        }

        .reload-btn:not(:disabled):hover {
            background: var(--btn-hover);
            color: #ffffff;
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 15px 30px -5px rgba(217, 119, 6, 0.25);
        }

        .reload-btn:not(:disabled):active {
            transform: translateY(0) scale(0.99);
        }

        .progress-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--theme-accent);
            width: 100%;
            transition: width 5s linear;
        }

        .timer-badge {
            font-family: 'Space Grotesk', sans-serif;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: clamp(0.8rem, 2.2vw, 0.88rem);
        }

        /* ==========================================================
           ANIMASI TEKNISI DI BAWAH (MENYESUAIKAN LAYAR HP / DESKTOP)
           ========================================================== */
        .scene-container {
            position: fixed;
            bottom: clamp(10px, 3vh, 25px);
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 110px;
            z-index: 5;
            pointer-events: none;
        }

        .electric-pole {
            position: absolute;
            bottom: 0;
            left: 160px;
            width: 6px;
            height: 100px;
            background: var(--silhouette);
            border-radius: 3px;
            transform-origin: bottom center;
        }
        
        .electric-pole.vibrating {
            animation: poleIntenseVibrate 0.12s ease-in-out infinite alternate;
        }

        @keyframes poleIntenseVibrate {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(1.2px) rotate(0.6deg); }
        }

        .crossarm {
            position: absolute;
            top: 10px;
            left: -24px;
            width: 55px;
            height: 5px;
            background: var(--silhouette);
            border-radius: 2px;
        }

        .crossarm::before, .crossarm::after {
            content: '';
            position: absolute;
            top: -5px;
            width: 5px;
            height: 7px;
            background: var(--silhouette);
        }
        .crossarm::before { left: 8px; }
        .crossarm::after { right: 8px; }

        .ladder {
            position: absolute;
            bottom: 0;
            left: 134px;
            width: 16px;
            height: 85px;
            border-left: 2.5px solid var(--silhouette);
            border-right: 2.5px solid var(--silhouette);
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 10px,
                var(--silhouette) 10px,
                var(--silhouette) 12px
            );
            transform-origin: bottom center;
            transform: rotate(10deg);
        }

        .worker-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 22px;
            height: 52px;
            animation: workerPathDynamic 10s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-fill-mode: forwards;
        }

        @keyframes workerPathDynamic {
            0% { transform: translateX(-180px) translateY(0); }
            40% { transform: translateX(116px) translateY(0); }
            42% { transform: translateX(118px) translateY(-10px); }
            50% { transform: translateX(123px) translateY(-26px); }
            58% { transform: translateX(128px) translateY(-42px); }
            66% { transform: translateX(133px) translateY(-56px); }
            70%, 100% { transform: translateX(136px) translateY(-62px); }
        }

        .worker-body-anim {
            position: relative;
            width: 22px;
            height: 52px;
            animation: bodyBreathAdvanced 1.8s ease-in-out infinite alternate;
        }

        @keyframes bodyBreathAdvanced {
            0% { transform: translateY(0) scaleY(1); }
            100% { transform: translateY(1.5px) scaleY(0.97); }
        }

        .head {
            width: 10px;
            height: 10px;
            background: var(--silhouette);
            border-radius: 50%;
            margin: 0 auto;
            transform-origin: bottom center;
        }
        
        .torso {
            width: 12px;
            height: 18px;
            background: var(--silhouette);
            border-radius: 4px;
            margin: 1px auto;
            position: relative;
        }

        .arm-left, .arm-right {
            position: absolute;
            top: 1px;
            width: 3.5px;
            height: 15px;
            background: var(--silhouette);
            border-radius: 2px;
            transform-origin: top center;
        }
        .arm-left {
            left: -4.5px;
            animation: walkArmLeft 0.35s ease-in-out infinite alternate;
        }
        .arm-right {
            right: -4.5px;
            animation: walkArmRight 0.35s ease-in-out infinite alternate;
        }

        @keyframes walkArmLeft {
            0% { transform: rotate(-30deg); }
            100% { transform: rotate(30deg); }
        }
        @keyframes walkArmRight {
            0% { transform: rotate(30deg); }
            100% { transform: rotate(-30deg); }
        }

        .legs-container {
            display: flex;
            justify-content: space-between;
            width: 10px;
            margin: 0 auto;
        }
        .leg-left, .leg-right {
            width: 3.5px;
            height: 16px;
            background: var(--silhouette);
            border-radius: 2px;
            transform-origin: top center;
        }
        .leg-left {
            animation: walkLegLeft 0.35s ease-in-out infinite alternate;
        }
        .leg-right {
            animation: walkLegRight 0.35s ease-in-out infinite alternate;
        }

        @keyframes walkLegLeft {
            0% { transform: rotate(35deg); }
            100% { transform: rotate(-35deg); }
        }
        @keyframes walkLegRight {
            0% { transform: rotate(-35deg); }
            100% { transform: rotate(35deg); }
        }

        .worker-container.climbing {
            transform-origin: bottom center;
            transform: rotate(10deg);
        }
        .worker-container.climbing .worker-body-anim {
            animation: climbMotion 0.45s ease-in-out infinite alternate;
        }
        .worker-container.climbing .arm-left {
            animation: climbArmL 0.45s ease-in-out infinite alternate;
        }
        .worker-container.climbing .arm-right {
            animation: climbArmR 0.45s ease-in-out infinite alternate;
        }
        .worker-container.climbing .leg-left {
            animation: climbLegL 0.45s ease-in-out infinite alternate;
        }
        .worker-container.climbing .leg-right {
            animation: climbLegR 0.45s ease-in-out infinite alternate;
        }

        @keyframes climbMotion {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-5px) rotate(3deg); }
        }
        @keyframes climbArmL { 0% { transform: rotate(-25deg); } 100% { transform: rotate(25deg); } }
        @keyframes climbArmR { 0% { transform: rotate(25deg); } 100% { transform: rotate(-25deg); } }
        @keyframes climbLegL { 0% { transform: rotate(25deg); } 100% { transform: rotate(-25deg); } }
        @keyframes climbLegR { 0% { transform: rotate(-25deg); } 100% { transform: rotate(25deg); } }

        .worker-container.settled {
            transform: translateX(136px) translateY(-62px) rotate(0deg) !important;
            animation: none !important;
        }
        .worker-container.settled .worker-body-anim {
            animation: fixBodyActive 0.6s ease-in-out infinite alternate !important;
        }
        .worker-container.settled .head {
            animation: fixHeadScan 2.5s ease-in-out infinite !important;
        }
        .worker-container.settled .arm-left {
            animation: fixArmWelding 0.2s ease-in-out infinite alternate !important;
        }
        .worker-container.settled .arm-right {
            animation: fixArmTighten 0.35s ease-in-out infinite alternate !important;
        }
        .worker-container.settled .leg-left,
        .worker-container.settled .leg-right {
            animation: none !important;
            transform: rotate(0deg) !important;
        }

        @keyframes fixBodyActive {
            0% { transform: translateY(0) rotate(-1.5deg); }
            100% { transform: translateY(-3px) rotate(1.5deg); }
        }

        @keyframes fixHeadScan {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }

        @keyframes fixArmWelding {
            0% { transform: rotate(-60deg) scale(1); }
            100% { transform: rotate(-20deg) scale(1.05); }
        }

        @keyframes fixArmTighten {
            0% { transform: rotate(30deg); }
            100% { transform: rotate(85deg); }
        }

        .spark {
            position: absolute;
            top: 10px;
            left: 162px;
            width: 7px;
            height: 7px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px #f59e0b, 0 0 25px #d97706, 0 0 40px #ef4444, 0 0 60px #38bdf8;
            animation: realSparkAction 0.25s infinite steps(4);
            opacity: 0;
            animation-delay: 7s;
        }

        @keyframes realSparkAction {
            0% { transform: scale(0.3) translate(0, 0); opacity: 0; }
            40% { transform: scale(2) translate(10px, -12px); opacity: 1; }
            100% { transform: scale(0.5) translate(20px, -24px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="mesh-background"></div>
    <div class="ambient-glow"></div>

    <div class="page-transition" id="pageTransition">
        <div class="modern-spinner"></div>
        <div class="transition-text">Memuat ulang website...</div>
    </div>

    <!-- Header Controls -->
    <div class="controls-container">
        <div class="audio-controls">
            <button class="control-btn" id="bgmToggle" title="Musik Latar (BGM)">🎵</button>
            <button class="control-btn" id="sfxToggle" title="Efek Suara (SFX)">🔊</button>
        </div>
        <div class="right-controls">
            <button class="control-btn" id="themeBtn" title="Ganti Mode">☀️</button>
        </div>
    </div>

    <canvas id="particleCanvas"></canvas>

    <div class="hud-wrapper">
        <div class="hud-container">
            <div class="hud-header">
                <div class="hud-dot"></div>
                <span class="hud-title-tag">Website Under Maintenance</span>
            </div>
            
            <h1>Website Sedang Maintenance</h1>
            
            <p class="hud-desc">
                Pembetulan kompatibelitas dengan berbagai device. Mohon tunggu beberapa saat hingga website kembali normal.
            </p>

            <div class="action-group">
                <button class="reload-btn" id="reloadBtn" disabled>
                    <span>Memuat ulang dalam</span>
                    <span class="timer-badge" id="timer">5s</span>
                    <div class="progress-indicator" id="progressIndicator" style="width: 100%;"></div>
                </button>
            </div>
        </div>
    </div>

    <div class="scene-container">
        <div class="electric-pole" id="electricPole">
            <div class="crossarm"></div>
        </div>
        <div class="spark"></div>
        <div class="ladder"></div>
        <div class="worker-container" id="workerContainer">
            <div class="worker-body-anim">
                <div class="head"></div>
                <div class="torso">
                    <div class="arm-left"></div>
                    <div class="arm-right"></div>
                </div>
                <div class="legs-container">
                    <div class="leg-left"></div>
                    <div class="leg-right"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================
        // MANAJEMEN TEMA (LIGHT / DARK MODE DENGAN LOCALSTORAGE)
        // ==========================================================
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeBtn');

        let savedTheme = localStorage.getItem('maintenance_theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeBtn.textContent = savedTheme === 'light' ? '☀️' : '🌙';

        themeBtn.addEventListener('click', () => {
            playSfxClick();
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('maintenance_theme', newTheme);
            themeBtn.textContent = newTheme === 'light' ? '☀️' : '🌙';
        });


        // ==========================================================
        // SISTEM AUDIO (SFX, BGM & LOCALSTORAGE SAVING)
        // ==========================================================
        let audioCtx = null;
        let bgmInterval = null;

        let bgmEnabled = localStorage.getItem('maintenance_bgm') !== 'false';
        let sfxEnabled = localStorage.getItem('maintenance_sfx') !== 'false';

        const bgmBtn = document.getElementById('bgmToggle');
        const sfxBtn = document.getElementById('sfxToggle');

        function updateAudioButtonUI() {
            if (bgmEnabled) {
                bgmBtn.classList.remove('disabled');
                bgmBtn.title = "Musik Latar: Aktif";
            } else {
                bgmBtn.classList.add('disabled');
                bgmBtn.title = "Musik Latar: Nonaktif";
            }

            if (sfxEnabled) {
                sfxBtn.classList.remove('disabled');
                sfxBtn.title = "Efek Suara: Aktif";
            } else {
                sfxBtn.classList.add('disabled');
                sfxBtn.title = "Efek Suara: Nonaktif";
            }
        }
        updateAudioButtonUI();

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSfxClick() {
            if (!sfxEnabled) return;
            initAudioContext();
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.04);

                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                console.log(e);
            }
        }

        const chordFrequencies = [
            [261.63, 329.63, 392.00], 
            [220.00, 261.63, 329.63], 
            [174.61, 220.00, 261.63], 
            [196.00, 246.94, 293.66]  
        ];
        let chordIndex = 0;

        function playBgmChord() {
            if (!bgmEnabled) return;
            initAudioContext();
            try {
                let chord = chordFrequencies[chordIndex];
                chordIndex = (chordIndex + 1) % chordFrequencies.length;

                chord.forEach(freq => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 1.5);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 4.5);
                });
            } catch (e) {
                console.log(e);
            }
        }

        function startBgm() {
            if (bgmInterval) clearInterval(bgmInterval);
            if (bgmEnabled) {
                playBgmChord();
                bgmInterval = setInterval(playBgmChord, 4500);
            }
        }

        function stopBgm() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        bgmBtn.addEventListener('click', () => {
            initAudioContext();
            bgmEnabled = !bgmEnabled;
            localStorage.setItem('maintenance_bgm', bgmEnabled);
            updateAudioButtonUI();
            playSfxClick();

            if (bgmEnabled) {
                startBgm();
            } else {
                stopBgm();
            }
        });

        sfxBtn.addEventListener('click', () => {
            initAudioContext();
            sfxEnabled = !sfxEnabled;
            localStorage.setItem('maintenance_sfx', sfxEnabled);
            updateAudioButtonUI();
            playSfxClick();
        });

        window.addEventListener('click', () => {
            initAudioContext();
            if (bgmEnabled && !bgmInterval) {
                startBgm();
            }
        }, { once: true });


        // ==========================================================
        // ANIMASI & LOGIKA UTAMA WEBSITE
        // ==========================================================
        setTimeout(() => {
            const worker = document.getElementById('workerContainer');
            if(worker) worker.classList.add('climbing');
        }, 4000);

        setTimeout(() => {
            const worker = document.getElementById('workerContainer');
            const pole = document.getElementById('electricPole');
            if(worker) {
                worker.classList.remove('climbing');
                worker.classList.add('settled');
            }
            if(pole) {
                pole.classList.add('vibrating');
            }
        }, 7000);

        window.addEventListener('DOMContentLoaded', () => {
            const progress = document.getElementById('progressIndicator');
            if (progress) {
                setTimeout(() => {
                    progress.style.width = '0%';
                }, 50);
            }
            if (bgmEnabled) {
                setTimeout(startBgm, 1000);
            }
        });

        let timeLeft = 5;
        const reloadBtn = document.getElementById('reloadBtn');
        const timerSpan = document.getElementById('timer');
        const pageTransition = document.getElementById('pageTransition');

        const countdownInterval = setInterval(() => {
            timeLeft--;
            if (timerSpan) timerSpan.textContent = timeLeft + 's';

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                reloadBtn.removeAttribute('disabled');
                reloadBtn.innerHTML = "Muat Ulang Halaman";
            }
        }, 1000);

        reloadBtn.addEventListener('click', () => {
            playSfxClick();
            pageTransition.classList.add('active');
            setTimeout(() => {
                location.reload();
            }, 800);
        });

        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 180 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Dukungan touch untuk mobile/tablet pada partikel
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchend', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.8;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < mouse.radius) {
                        let force = (mouse.radius - dist) / mouse.radius;
                        this.x -= (dx / dist) * force * 3.5;
                        this.y -= (dy / dist) * force * 3.5;
                    }
                }
            }
            draw() {
                ctx.fillStyle = html.getAttribute('data-theme') === 'dark' ? 'rgba(245, 158, 11, 0.35)' : 'rgba(217, 119, 6, 0.35)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            let count = (canvas.width * canvas.height) / 8000;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 120) {
                        let opacity = 1 - (dist / 120);
                        let lineColor = html.getAttribute('data-theme') === 'dark' ? `rgba(245, 158, 11, ${opacity * 0.12})` : `rgba(217, 119, 6, ${opacity * 0.12})`;
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 0.7;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            connectParticles();
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
